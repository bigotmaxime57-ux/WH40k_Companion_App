# Intégration continue (ticket #7) : à chaque push, sur toutes les branches, et sur les pull requests ; reprise aussi par
# le déploiement (deploy.yml), qui ne déploie que si elle est verte.
# - Linux : build et tous les tests, sans le desktop (Wh40kSim.CI.slnf) ; même système que le serveur en ligne.
# - Windows : build de toute la solution, desktop MAUI compris (charge de travail maui-windows), sans relancer les tests.
# Comme en local : 0 erreur et 0 avertissement (-warnaserror).
name: CI

on:
  push:
    branches: ['**']             # les tags de version passent par le déploiement, qui lance lui-même la CI
  pull_request:
  workflow_call:

permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution en cours, devenue inutile (groupe propre au flux appelant :
# appelée par le déploiement, la CI ne s'annule pas avec une autre exécution)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  linux:
    name: Build et tests (Linux, sans le desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache des paquets NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Restauration avec la configuration du build : certains réglages en dépendent (paquets de runtime)
      - name: Restauration
        run: dotnet restore Wh40kSim.CI.slnf -p:Configuration=Release

      - name: Build
        run: dotnet build Wh40kSim.CI.slnf --no-restore -c Release -warnaserror

      - name: Tests
        run: dotnet test Wh40kSim.CI.slnf --no-build -c Release --logger trx --results-directory TestResults

      - name: Résultats des tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultats-tests-linux
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  windows:
    name: Build complet (Windows, desktop compris)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache des paquets NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Charge de travail MAUI
        run: dotnet workload install maui-windows

      - name: Restauration
        run: dotnet restore Wh40kSim.sln -p:Configuration=Release

      - name: Build
        run: dotnet build Wh40kSim.sln --no-restore -c Release -warnaserror
