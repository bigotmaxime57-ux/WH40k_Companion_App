# Déploiement de la version web sur Fly.io : à chaque tag de version (v0.4, v0.5…), ou à la main depuis l'onglet
# « Actions ». La CI tourne d'abord (ci.yml) ; le déploiement n'a lieu que si elle est verte. L'image est construite
# ici, sur la machine GitHub (--local-only : la compilation AOT du client échouait sur les machines de construction de
# Fly, sans message, faute de mémoire probablement), envoyée au registre de Fly, puis lancée à la place de la version
# en ligne.
# Jeton de déploiement : secret du dépôt FLY_API_TOKEN (fly tokens create deploy, puis gh secret set FLY_API_TOKEN).
name: Déploiement

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois, jamais interrompu par le suivant
concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Déploiement sur Fly.io
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Déploiement
        run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
